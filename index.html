<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Guy | Website Under Construction</title>
    <meta name="description" content="Solar Guy Electrical Services website is currently under construction.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<main class="construction-page">
    <header class="header">
        <a href="/" class="logo">
            <img src="assets/logo.png" alt="Solar Guy Electrical Services">
        </a>

        <nav class="social-links" aria-label="Social media">
            <a href="https://www.facebook.com/solarguyelectricalservices" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/solarguyelectricalservices" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@solarguyelectrical" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://wa.me/message/XN35YZZVMEGRD1" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
        </nav>
    </header>

    <section class="hero">
        <div class="content">
            <div class="heading">
                <h1>
                    <span>UNDER</span>
                    <strong>CONSTRUCTION</strong>
                </h1>
                <div class="heading-line">
                    <span></span><span></span>
                </div>
            </div>

            <p class="description">
                We're working hard to bring you a better experience.
                Our new website is almost ready to power up your world
                with clean, reliable and affordable solar solutions.
            </p>

            <a href="#contact" class="more-info">
                <span>MORE INFO</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

        <div class="construction-art">
            <div class="gear gear-one"><i class="fa-solid fa-gear"></i></div>
            <div class="gear gear-two"><i class="fa-solid fa-gear"></i></div>
            <div class="gear gear-three"><i class="fa-solid fa-gear"></i></div>

            <div class="warning-sign">
                <div class="warning-inner">!</div>
            </div>

            <div class="barrier">
                <div class="barrier-top">
                    <div class="hazard-pattern"></div>
                </div>
                <div class="barrier-leg left"></div>
                <div class="barrier-leg right"></div>
            </div>

            <div class="traffic-cone cone-one">
                <div class="cone-body"><span></span><span></span></div>
                <div class="cone-base"></div>
            </div>

            <div class="traffic-cone cone-two">
                <div class="cone-body"><span></span><span></span></div>
                <div class="cone-base"></div>
            </div>

            <div class="bottom-hazard"></div>
        </div>
    </section>

    <footer class="footer" id="contact">
        <div class="contact-item">
            <div class="contact-icon"><i class="fa-solid fa-phone"></i></div>
            <span>+234 806 759 3407</span>
        </div>

        <div class="footer-divider"></div>

        <div class="contact-item">
            <div class="contact-icon"><i class="fa-solid fa-envelope"></i></div>
            <span>support@solarguy.com.ng</span>
        </div>

        <div class="footer-divider"></div>

        <div class="contact-item">
            <div class="contact-icon"><i class="fa-solid fa-location-dot"></i></div>
            <span>Lagos, Nigeria</span>
        </div>

        <div class="footer-divider"></div>

        <div class="tagline">
            <span>Powering a sustainable tomorrow.</span>
            <i class="fa-solid fa-leaf"></i>
        </div>
    </footer>
</main>
</body>
</html>
